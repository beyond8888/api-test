# Docker 部署 ApiTester

services:
  backend:
    build: ./backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DEBUG=${DJANGO_DEBUG:-false}
      - SECRET_KEY=${DJANGO_SECRET_KEY}
      - ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost}
      - API_PROXY_ALLOW_PRIVATE=${API_PROXY_ALLOW_PRIVATE:-0}
      # Set REDIS_URL to enable cross-worker rate-limiting & caching.
      # Uncomment the `redis` service below and set e.g. REDIS_URL=redis://redis:6379/0
      - REDIS_URL=${REDIS_URL:-}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

  # ── Optional Redis (cross-worker rate-limiting & caching) ──
  # Uncomment to enable accurate DRF throttle counting across Uvicorn workers.
  # Set REDIS_URL=redis://redis:6379/0 in the backend environment.
  #
  # redis:
  #   image: redis:7-alpine
  #   restart: always
  #   ports:
  #     - "6379:6379"
