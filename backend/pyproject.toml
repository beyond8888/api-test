[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["venv", ".venv", "__pycache__", "migrations", "static", "media"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # Pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "RET", # flake8-return
]
ignore = [
  "E501", # line-too-long (handled by formatter)
]

[tool.ruff.format]
quote-style = "single"
